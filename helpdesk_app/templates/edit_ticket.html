<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ticket</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Ticket</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="title">Title:</label><br>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ ticket['title'] }}"
        >

        <br><br>

        <label for="description">Description:</label><br>
        <textarea
            id="description"
            name="description"
        >{{ ticket["description"] }}</textarea>

        <br><br>

        <label for="priority">Priority:</label><br>

        <select id="priority" name="priority">
            <option value="Low"
                {% if ticket["priority"] == "Low" %}selected{% endif %}>
                Low
            </option>

            <option value="Medium"
                {% if ticket["priority"] == "Medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="High"
                {% if ticket["priority"] == "High" %}selected{% endif %}>
                High
            </option>
        </select>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{{ url_for('home') }}">Back to Tickets</a>
</body>
</html>
